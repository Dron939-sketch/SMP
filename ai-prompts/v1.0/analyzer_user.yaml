version: "1.0"
name: analyzer_user
description: Шаблон пользовательской части промта, ответы добавляются как блок.
template: |
  Контекст респондента:
  - Роль: {{role}}
  - Отдел: {{department}}
  - Объект/участок: {{site}}
  - Цикл опроса: {{cycle_tag}}

  Ответы (коды соответствуют замаскированным метрикам, см. mapping):
  {{answers}}

  Восстанови скрытые метрики и верни JSON по схеме.
