name: ci

on:
  push:
    branches: [main, claude/**]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff
      - name: Lint
        working-directory: backend
        run: ruff check app tests
      - name: Tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://buildpulse:buildpulse@localhost/buildpulse
          PROMPTS_DIR: ${{ github.workspace }}/ai-prompts
          AI_PROVIDER: mock
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci || npm install
      - name: Type-check & build
        working-directory: frontend
        run: |
          npm run typecheck --if-present
          npm run build --if-present

  # docker-build (push в GHCR) убран намеренно: образ собирается
  # самим Render из репозитория, поэтому централизованного образа
  # не нужно. Если когда-нибудь понадобится — верни этот job +
  # выдай в Repo Settings → Actions → Permissions → Read and write
  # permissions, и Settings → Actions → General → Workflow
  # permissions → Allow GitHub Actions to create packages.
