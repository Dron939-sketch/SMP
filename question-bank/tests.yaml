# Готовые шаблоны тестов для замполита СпецМонтажПроект.
# Каждый шаблон фокусируется на своих метриках, но использует один и
# тот же банк замаскированных вопросов.
#
# Два описания на каждый тест:
#   cover_story — то, что показывают сотрудникам (нейтральная "обложка");
#   real_focus  — что тест реально замеряет (для замполита, на дашборде).

tests:
  - slug: pulse_short
    title: "Пульс недели"
    cover_story: |
      Короткий пятиминутный опрос: как прошла неделя на объекте,
      что улучшить в графике и инструментах. 6 вопросов.
    real_focus: |
      Стресс, баланс работа/жизнь, доверие к непосредственному
      руководителю. Замер еженедельной динамики настроения.
    cycle: weekly
    time_limit_seconds: 600
    question_codes:
      - Q_BREAK_HABITS
      - Q_NIGHT_THOUGHTS
      - Q_LATE_CALL
      - Q_HELP_SCENARIO
      - Q_SHIFT_RITUAL
      - Q_FRIEND_PITCH

  - slug: brand_image
    title: "Образ компании в голове"
    cover_story: |
      Помогите нам улучшить HR-бренд: расскажите, что бы вы говорили
      о компании друзьям-строителям. Глубокий опрос, ~15 минут.
    real_focus: |
      Бренд работодателя, ключевые слова "образа", намерение
      остаться, чувствительные триггеры ухода. Базовая линия для
      VK/HR-коммуникаций.
    cycle: quarterly
    time_limit_seconds: 1200
    question_codes:
      - Q_FRIEND_PITCH
      - Q_BRAND_KEYWORD
      - Q_RECOMMEND_FRIEND
      - Q_PRIDE_STORY
      - Q_LEAVE_TRIGGER
      - Q_GROW_NEXT_YEAR

  - slug: safety_culture
    title: "Культура безопасности на участке"
    cover_story: |
      Проверяем, насколько удобны процедуры по охране труда и
      инструктажам. ~10 минут.
    real_focus: |
      Реальная safety_culture, готовность сообщать о нарушениях,
      психологическая безопасность в бригаде. Критичный показатель.
    cycle: monthly
    time_limit_seconds: 900
    question_codes:
      - Q_SHIFT_RITUAL
      - Q_SAFETY_REPORT
      - Q_BLAME_DIRECTION
      - Q_HELP_SCENARIO
      - Q_NEW_IDEA_PATH

  - slug: leadership_trust
    title: "Связь с руководством"
    cover_story: |
      Обратная связь о коммуникации между бригадой, мастером и
      офисом. Помогите выровнять процессы. ~10 минут.
    real_focus: |
      Доверие к руководству, психологическая безопасность,
      и главное — детектор "anchor_pretender" (внешне лояльный
      сотрудник, по факту тормозящий команду).
    cycle: monthly
    time_limit_seconds: 900
    question_codes:
      - Q_NEW_IDEA_PATH
      - Q_BLAME_DIRECTION
      - Q_TEAM_CREDIT
      - Q_LATE_CALL
      - Q_RECOMMEND_FRIEND
      - Q_BRAND_KEYWORD
      - Q_BRIGHT_FUTURE_REVERSE

  - slug: full_annual
    title: "Годовой большой опрос"
    cover_story: |
      Ежегодный опрос вовлечённости. Хотим сделать компанию
      удобнее для жизни и работы. ~25 минут.
    real_focus: |
      Полный психометрический срез по всем 10 шкалам.
      Базовая линия для трендов, основа отчётов руководству.
    cycle: yearly
    time_limit_seconds: 1800
    question_codes:
      - Q_BREAK_HABITS
      - Q_NIGHT_THOUGHTS
      - Q_LATE_CALL
      - Q_FRIEND_PITCH
      - Q_BRAND_KEYWORD
      - Q_RECOMMEND_FRIEND
      - Q_PRIDE_STORY
      - Q_NEW_IDEA_PATH
      - Q_BLAME_DIRECTION
      - Q_SAFETY_REPORT
      - Q_HELP_SCENARIO
      - Q_TEAM_CREDIT
      - Q_SHIFT_RITUAL
      - Q_GROW_NEXT_YEAR
      - Q_LEAVE_TRIGGER
      - Q_BRIGHT_FUTURE_REVERSE
